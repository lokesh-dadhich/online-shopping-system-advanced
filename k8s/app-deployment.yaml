apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shopping-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-shopping-app
  template:
    metadata:
      labels:
        app: online-shopping-app
    spec:
      containers:
        - name: online-shopping-app
          image: 809338888549.dkr.ecr.ap-south-1.amazonaws.com/new/php:latest
          ports:
            - containerPort: 80

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: online-shopping-config
                  key: DB_HOST

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: online-shopping-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: online-shopping-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: online-shopping-secret
                  key: DB_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
